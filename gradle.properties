org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Dev-only override for the tunnel WebSocket URL (debug builds only), e.g.
#   ./gradlew :app:assembleDebug -Pankimcp.tunnelUrl=wss://ankidroid.ankimcp.uk
#   ./gradlew :app:assembleDebug -Pankimcp.tunnelUrl=ws://10.0.2.2:3004   (local relay from the emulator)
# Release builds always use wss://ankidroid.ankimcp.ai.
#ankimcp.tunnelUrl=wss://ankidroid.ankimcp.ai
